<!DOCTYPE html>
<html>
<head>
    <title>Secure Bank Login</title>
    <style>
        body {
            margin:0;
            font-family: Arial;
            background: linear-gradient(135deg,#4e73df,#1cc88a);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card {
            background:white;
            padding:40px;
            width:380px;
            border-radius:12px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            text-align:center;
        }

        input {
            width:100%;
            padding:12px;
            margin-bottom:12px;
            border-radius:6px;
            border:1px solid #ccc;
        }

        button {
            width:100%;
            padding:12px;
            border:none;
            border-radius:6px;
            font-size:15px;
            cursor:pointer;
            margin-bottom:10px;
        }

        .face-btn { background:#1cc88a; color:white; }
        .login-btn { background:#4e73df; color:white; }

        .alert {
            padding:10px;
            margin-bottom:10px;
            border-radius:6px;
        }

        .success { background:#d4edda; color:#155724; }
        .error { background:#f8d7da; color:#721c24; }

        .link a {
            color:#e74a3b;
            text-decoration:none;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="card">

<h2>Secure Bank Login</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="alert {% if 'success' in category %}success{% else %}error{% endif %}">
        {{ message }}
    </div>
  {% endfor %}
{% endwith %}

<form method="post">

    <input type="text" name="account_number" placeholder="Account Number" required>
    <input type="password" name="password" placeholder="Password" required>

    <!-- Face Verification Button -->
    <button formaction="/verify_face_only" formmethod="post" class="face-btn">
        Verify Face ID
    </button>

    <!-- Final Login Button -->
    <button formaction="/login_user" formmethod="post" class="login-btn">
        Login
    </button>

</form>

<div class="link">
    Not registered? <a href="/register">Create Account</a>
</div>

</div>

</body>
</html>
