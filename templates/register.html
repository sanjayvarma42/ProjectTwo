<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1cc88a, #4e73df);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 40px;
            width: 400px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        .capture-btn {
            background: #4e73df;
            color: white;
        }

        .capture-btn:hover {
            background: #2e59d9;
        }

        .register-btn {
            background: #1cc88a;
            color: white;
        }

        .register-btn:hover {
            background: #17a673;
        }

        .link {
            margin-top: 10px;
        }

        .link a {
            color: #e74a3b;
            text-decoration: none;
            font-weight: bold;
        }

        .link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 14px;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>

<div class="card">

    <h2>Create Account</h2>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert {% if 'success' in category %}success{% else %}error{% endif %}">
            {{ message }}
        </div>
      {% endfor %}
    {% endwith %}

    <!-- Capture Face -->
    <form action="/capture_face" method="post">
        <input type="text" name="account_number" placeholder="Enter 6-digit Account Number" required>
        <button type="submit" class="capture-btn">
            Capture Face
        </button>
    </form>

    <hr>

    <!-- Register -->
    <form action="/register_user" method="post">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="text" name="account_number" placeholder="6-digit Account Number" required>
        <input type="text" name="mobile" placeholder="Mobile Number" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="register-btn">
            Register
        </button>
    </form>

    <div class="link">
        Already have an account?
        <a href="/">Login</a>
    </div>

</div>

</body>
</html>
