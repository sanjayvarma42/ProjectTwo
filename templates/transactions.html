<!DOCTYPE html>
<html>
<head>
    <title>Transaction History</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1cc88a, #4e73df);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 650px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        table th {
            background-color: #4e73df;
            color: white;
            padding: 10px;
        }

        table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        table tr:hover {
            background-color: #f2f2f2;
        }

        .back-link a {
            text-decoration: none;
            color: #1cc88a;
            font-weight: bold;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

<div class="card">

    <h2>Transaction History</h2>

    <table>
        <tr>
            <th>Type</th>
            <th>Amount (₹)</th>
            <th>Date</th>
        </tr>

        {% for t in data %}
        <tr>
            <td>{{ t[0] }}</td>
            <td>{{ t[1] }}</td>
            <td>{{ t[2] }}</td>
        </tr>
        {% endfor %}
    </table>

    <div class="back-link">
        <a href="/dashboard">Back to Dashboard</a>
    </div>

</div>

</body>
</html>
