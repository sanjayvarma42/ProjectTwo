<!DOCTYPE html>
<html>
<head>
    <title>Bank Management System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: url("{{ url_for('static', filename='images/bank.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            color: white;
        }

        /* Dark Overlay */
        .overlay {
            background: rgba(0, 0, 0, 0.65);
            height: 100vh;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background: rgba(0,0,0,0.8);
        }

        .navbar h2 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #1cc88a;
        }

        /* Center Content */
        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80%;
            text-align: center;
            flex-direction: column;
        }

        .content h1 {
            font-size: 50px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .content p {
            font-size: 20px;
            width: 60%;
        }

        .btn {
            margin-top: 30px;
            padding: 12px 25px;
            background: #1cc88a;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn:hover {
            background: #17a673;
        }

    </style>
</head>

<body>

<div class="overlay">

    <!-- Navbar -->
    <div class="navbar">
        <h2>Bank Managment</h2>

        <div class="nav-links">
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('register') }}">Register</a>
            <a href="{{ url_for('about') }}">About</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content">
        <h1>Bank Management System <br> with Face Recognition</h1>

        <a href="{{ url_for('login') }}" class="btn">Get Started</a>
    </div>

</div>

</body>
</html>
